name: Native Windows UI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows:
    if: github.repository == 'JAAvila-Of/Treesi' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TREESI_ISOLATED_SUITE: native-ui
    steps:
      - name: Require a disposable interactive hosted VM
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or -not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) {
            throw 'Native UI tests require an interactive GitHub-hosted VM; developer desktops and services are refused.'
          }
          "TREESI_NATIVE_RESULTS=$env:RUNNER_TEMP/treesi-native-results" >> $env:GITHUB_ENV
          "APPIUM_HOME=$env:RUNNER_TEMP/treesi-appium-home" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Publish the isolated drag source without changing product startup
        shell: pwsh
        run: |
          dotnet restore tools/Treesi.RenderingLab --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish tools/Treesi.RenderingLab -c Release --self-contained false --no-restore --output "$env:RUNNER_TEMP/treesi-drag-source"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "TREESI_NATIVE_DRAG_SOURCE=$env:RUNNER_TEMP/treesi-drag-source/Treesi.RenderingLab.exe" >> $env:GITHUB_ENV
      - name: Extract the portable candidate and compile native tests
        shell: pwsh
        run: |
          ./tools/Build-Portable.ps1 -Runtime win-x64 -WorkDirectory "$env:RUNNER_TEMP/treesi-portable"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = @(Get-ChildItem "$env:RUNNER_TEMP/treesi-portable/output" -Filter '*.zip')
          if ($archive.Count -ne 1) { throw 'Expected one portable archive.' }
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath "$env:RUNNER_TEMP/treesi-app"
          $directory = @(Get-ChildItem "$env:RUNNER_TEMP/treesi-app" -Directory)
          if ($directory.Count -ne 1) { throw 'Expected one extracted application directory.' }
          $manifest = Get-Content (Join-Path $directory[0].FullName 'package-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -ne $env:GITHUB_SHA) { throw 'Portable source identity mismatch.' }
          dotnet restore tests/Treesi.Native.Tests --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build tests/Treesi.Native.Tests --configuration Release --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tools/Build-WindowsInstaller.ps1 -PortableDirectory $directory[0].FullName -WorkDirectory "$env:RUNNER_TEMP/treesi-installer"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $installer = @(Get-ChildItem "$env:RUNNER_TEMP/treesi-installer/output" -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one installer.' }
          "TREESI_NATIVE_INSTALLER=$($installer[0].FullName)" >> $env:GITHUB_ENV
      - name: Verify per-user installation and bounded removal in this VM
        shell: pwsh
        run: |
          dotnet test tests/Treesi.Native.Tests -c Release --no-build --filter 'TestCategory=NativeInstaller' --logger trx --results-directory "$env:TREESI_NATIVE_RESULTS/installer-tests"
          if ($LASTEXITCODE) { throw 'Installer lifecycle verification failed.' }
      - name: Install the verified candidate for native UI acceptance
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or -not [Environment]::UserInteractive) { throw 'Installation requires the isolated VM.' }
          $process = Start-Process -FilePath $env:TREESI_NATIVE_INSTALLER -ArgumentList '/S' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode) { throw 'Per-user installation failed.' }
          $application = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Programs/Treesi Preview/Treesi.Desktop.exe'
          if (!(Test-Path -LiteralPath $application)) { throw 'The installed application is missing.' }
          "TREESI_NATIVE_APP=$application" >> $env:GITHUB_ENV
      - name: Install pinned Appium tools only inside this VM
        shell: pwsh
        run: |
          npm ci --prefix eng/native-tools --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & './eng/native-tools/node_modules/.bin/appium.cmd' driver install --source=local "$pwd/eng/native-tools/node_modules/appium-wincore-driver"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run Appium and native tests in one owned process lifetime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:TREESI_NATIVE_RESULTS | Out-Null
          $entry = Join-Path $pwd 'eng/native-tools/node_modules/appium/build/lib/main.js'
          $arguments = @('"' + $entry + '"', '--address', '127.0.0.1', '--port', '4723', '--log-no-colors')
          $server = Start-Process -FilePath (Get-Command node.exe).Source -ArgumentList $arguments -WindowStyle Hidden -RedirectStandardOutput "$env:TREESI_NATIVE_RESULTS/appium.stdout.log" -RedirectStandardError "$env:TREESI_NATIVE_RESULTS/appium.stderr.log" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try { $status = Invoke-RestMethod 'http://127.0.0.1:4723/status'; if ($status.value.ready) { $ready = $true; break } } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Appium did not become ready on loopback.' }
            dotnet test tests/Treesi.Native.Tests --configuration Release --no-build --filter '(TestCategory!=NativePerformance|TestCategory=NativeUiPreference|TestCategory=NativeUiDrop)&TestCategory!=NativeInstaller&TestCategory!=LinuxNative' --logger trx --results-directory "$env:TREESI_NATIVE_RESULTS/tests"
            if ($LASTEXITCODE) { throw "Native UI tests failed (exit $LASTEXITCODE)." }
          }
          finally {
            if (-not $server.HasExited) { $server.Kill($true) }
          }
      - name: Attest the installer tested in this VM
        id: installer-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.TREESI_NATIVE_INSTALLER }}
      - name: Verify installer source and builder before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.installer-provenance.outputs.bundle-path }}
        run: |
          $verified = & gh attestation verify $env:TREESI_NATIVE_INSTALLER --bundle $env:ATTESTATION_BUNDLE `
            --repo JAAvila-Of/Treesi --signer-workflow JAAvila-Of/Treesi/.github/workflows/native-ui.yml `
            --source-ref refs/heads/main --source-digest '${{ github.sha }}' --format json
          if ($LASTEXITCODE) { throw 'Installer provenance failed.' }
          $verified | Set-Content "$env:RUNNER_TEMP/treesi-installer/output/provenance-verification.json"
          Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE -Destination "$env:TREESI_NATIVE_INSTALLER.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows-x64
          path: ${{ runner.temp }}/treesi-installer/output
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-windows-results
          path: ${{ runner.temp }}/treesi-native-results
          retention-days: 3
          if-no-files-found: warn
