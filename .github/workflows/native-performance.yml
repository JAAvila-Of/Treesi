name: Native Windows process performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      TREESI_ISOLATED_SUITE: native-performance
      TREESI_NATIVE_CAPTURE_SCOPE: disposable-vm-pid-export
    steps:
      - name: Require a disposable interactive hosted VM
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or -not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) {
            throw 'Native UI tests require an interactive GitHub-hosted VM; developer desktops and services are refused.'
          }
          "TREESI_NATIVE_RESULTS=$env:RUNNER_TEMP/treesi-native-performance-results" >> $env:GITHUB_ENV
          "APPIUM_HOME=$env:RUNNER_TEMP/treesi-appium-home" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Publish application and compile native tests
        shell: pwsh
        run: |
          dotnet publish src/Treesi.Desktop --configuration Release --runtime win-x64 --self-contained true --output "$env:RUNNER_TEMP/treesi-app"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet restore tests/Treesi.Native.Tests --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build tests/Treesi.Native.Tests --configuration Release --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "TREESI_NATIVE_APP=$env:RUNNER_TEMP/treesi-app/Treesi.Desktop.exe" >> $env:GITHUB_ENV
      - name: Publish the isolated native stack exporter
        shell: pwsh
        run: |
          dotnet restore tools/Treesi.NativeProfiler --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish tools/Treesi.NativeProfiler -c Release --no-restore --output "$env:RUNNER_TEMP/treesi-native-profiler"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "TREESI_NATIVE_PROFILER=$env:RUNNER_TEMP/treesi-native-profiler/Treesi.NativeProfiler.exe" >> $env:GITHUB_ENV
      - name: Install pinned Appium tools only inside this VM
        shell: pwsh
        run: |
          npm ci --prefix eng/native-tools --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & './eng/native-tools/node_modules/.bin/appium.cmd' driver install --source=local "$pwd/eng/native-tools/node_modules/appium-wincore-driver"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare the pinned standalone presentation collector
        shell: pwsh
        run: |
          $manifest = Get-Content eng/performance-tools/presentmon.json -Raw | ConvertFrom-Json
          $tools = Join-Path $env:RUNNER_TEMP 'treesi-presentmon'
          New-Item -ItemType Directory -Force $tools, $env:TREESI_NATIVE_RESULTS | Out-Null
          $executable = Join-Path $tools 'PresentMon.exe'
          Invoke-WebRequest -Uri $manifest.url -OutFile $executable
          if ((Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256) { throw 'PresentMon SHA-256 verification failed.' }
          Invoke-WebRequest -Uri $manifest.licenseUrl -OutFile "$env:TREESI_NATIVE_RESULTS/PresentMon-LICENSE.txt"
          Invoke-WebRequest -Uri $manifest.thirdPartyNoticesUrl -OutFile "$env:TREESI_NATIVE_RESULTS/PresentMon-THIRD_PARTY.txt"
          Copy-Item -LiteralPath eng/performance-tools/presentmon.json -Destination "$env:TREESI_NATIVE_RESULTS/presentmon-manifest.json"
          "TREESI_PRESENTMON_EXE=$executable" >> $env:GITHUB_ENV
          "TREESI_PRESENTMON_SHA256=$($manifest.sha256)" >> $env:GITHUB_ENV
      - name: Prepare the pinned managed stack sampler
        shell: pwsh
        run: |
          $manifest = Get-Content eng/performance-tools/dotnet-trace.json -Raw | ConvertFrom-Json
          $feed = Join-Path $env:RUNNER_TEMP 'treesi-diagnostics-feed'
          $tools = Join-Path $env:RUNNER_TEMP 'treesi-diagnostics'
          New-Item -ItemType Directory -Force $feed | Out-Null
          $package = Join-Path $feed "dotnet-trace.$($manifest.version).nupkg"
          Invoke-WebRequest -Uri $manifest.packageUrl -OutFile $package
          $digest = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($package)))
          if ($digest -cne $manifest.packageSha512) { throw 'dotnet-trace package SHA-512 verification failed.' }
          dotnet tool install dotnet-trace --tool-path $tools --source $feed --version $manifest.version --allow-roll-forward
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $installed = Join-Path $tools ".store/dotnet-trace/$($manifest.version)/dotnet-trace/$($manifest.version)"
          if ((Get-Content "$installed/dotnet-trace.$($manifest.version).nupkg.sha512" -Raw).Trim() -cne $manifest.packageSha512) { throw 'Installed sampler package digest differs.' }
          Copy-Item -LiteralPath "$installed/THIRD-PARTY-NOTICES.txt" -Destination "$env:TREESI_NATIVE_RESULTS/dotnet-trace-THIRD-PARTY-NOTICES.txt"
          Invoke-WebRequest -Uri $manifest.licenseUrl -OutFile "$env:TREESI_NATIVE_RESULTS/dotnet-trace-LICENSE.txt"
          Copy-Item -LiteralPath eng/performance-tools/dotnet-trace.json -Destination "$env:TREESI_NATIVE_RESULTS/dotnet-trace-manifest.json"
          & "$tools/dotnet-trace.exe" --version | Out-File "$env:TREESI_NATIVE_RESULTS/dotnet-trace-version.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "TREESI_DOTNET_TRACE=$tools/dotnet-trace.exe" >> $env:GITHUB_ENV
      - name: Record environment and run the isolated process measurements
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:TREESI_NATIVE_RESULTS | Out-Null
          $env:GITHUB_SHA | Out-File "$env:TREESI_NATIVE_RESULTS/source-commit.txt"
          dotnet --info | Out-File "$env:TREESI_NATIVE_RESULTS/environment.txt"
          git --version | Out-File "$env:TREESI_NATIVE_RESULTS/environment.txt" -Append
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List | Out-File "$env:TREESI_NATIVE_RESULTS/environment.txt" -Append
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-File "$env:TREESI_NATIVE_RESULTS/environment.txt" -Append
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-List | Out-File "$env:TREESI_NATIVE_RESULTS/environment.txt" -Append
          powercfg /getactivescheme | Out-File "$env:TREESI_NATIVE_RESULTS/environment.txt" -Append
          $size = (Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/treesi-app" -File -Recurse | Measure-Object Length -Sum).Sum
          "Self-contained publish directory bytes: $size" | Out-File "$env:TREESI_NATIVE_RESULTS/environment.txt" -Append
          $entry = Join-Path $pwd 'eng/native-tools/node_modules/appium/build/lib/main.js'
          $arguments = @('"' + $entry + '"', '--address', '127.0.0.1', '--port', '4723', '--log-no-colors')
          $server = Start-Process -FilePath (Get-Command node.exe).Source -ArgumentList $arguments -WindowStyle Hidden -RedirectStandardOutput "$env:TREESI_NATIVE_RESULTS/appium.stdout.log" -RedirectStandardError "$env:TREESI_NATIVE_RESULTS/appium.stderr.log" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try { $status = Invoke-RestMethod 'http://127.0.0.1:4723/status'; if ($status.value.ready) { $ready = $true; break } } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Appium did not become ready on loopback.' }
            dotnet test tests/Treesi.Native.Tests --configuration Release --no-build --filter 'TestCategory=NativePerformance' --logger trx --results-directory "$env:TREESI_NATIVE_RESULTS/tests"
            if ($LASTEXITCODE) { throw "Native UI tests failed (exit $LASTEXITCODE)." }
          }
          finally {
            if (-not $server.HasExited) { $server.Kill($true) }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-performance-results
          path: ${{ runner.temp }}/treesi-native-performance-results
          retention-days: 3
          if-no-files-found: warn
