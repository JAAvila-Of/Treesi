name: Benchmark smoke on isolated hosted VM

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-smoke
  cancel-in-progress: false

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TREESI_ISOLATED_SUITE: benchmarks
      TREESI_BENCHMARK_PROFILE: dry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet run --project benchmarks/Treesi.Benchmarks --configuration Release -- --filter '*Benchmarks*' --exporters json --artifacts '${{ runner.temp }}/treesi-benchmarks'
      - name: Record warm engine latency samples without enforcing reference-host targets
        run: dotnet run --project benchmarks/Treesi.Benchmarks --configuration Release --no-build -- --latency-report '${{ runner.temp }}/treesi-benchmarks/engine-latency.json'
        env:
          TREESI_BENCHMARK_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-smoke-results
          path: ${{ runner.temp }}/treesi-benchmarks
          retention-days: 3
          if-no-files-found: error
